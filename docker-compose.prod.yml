
services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  gateway:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
    restart: unless-stopped

  user-service:
    ports: !reset []
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://user-service
      GATEWAY_URL: http://gateway
    restart: unless-stopped

  catalog-service:
    ports: !reset []
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://catalog-service
    restart: unless-stopped

  order-service:
    ports: !reset []
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://order-service
    restart: unless-stopped
